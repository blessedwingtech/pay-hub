version: "3.8"

services:
  # ========================================================
  # PostgreSQL Database Service
  # ========================================================
  payhub-db:
    image: postgres:16-alpine
    container_name: payhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-payhub_production}
    volumes:
      - payhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payhub_user} -d ${POSTGRES_DB:-payhub_production}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payhub-network
    # Port 5432 is intentionally NOT published to host public IP for database security

  # ========================================================
  # BitTonik Pay-Hub Next.js Application
  # ========================================================
  payhub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payhub-app
    restart: unless-stopped
    depends_on:
      payhub-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Bound to 127.0.0.1 (local only), traffic routed securely through Nginx
      - "127.0.0.1:3000:3000"
    networks:
      - payhub-network

volumes:
  payhub_postgres_data:
    name: payhub_postgres_data

networks:
  payhub-network:
    name: payhub-network
    driver: bridge
